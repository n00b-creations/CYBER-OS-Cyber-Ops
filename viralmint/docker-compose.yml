services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: viralmint
      POSTGRES_PASSWORD: viralmint
      POSTGRES_DB: viralmint
    ports: ["5432:5432"]
    volumes: ["viralmint_pg:/var/lib/postgresql/data"]
  redis:
    image: redis:8-alpine
    restart: unless-stopped
    ports: ["6379:6379"]
    volumes: ["viralmint_redis:/data"]
volumes:
  viralmint_pg:
  viralmint_redis:
